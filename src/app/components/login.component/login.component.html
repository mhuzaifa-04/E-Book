<div class="login-page-container">
  <div class="login-card">
    <h2>Library Access Portal</h2>
    <p class="subtitle">Please sign in to view your digital library records</p>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" [(ngModel)]="credentials.username" required placeholder="Enter admin" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" [(ngModel)]="credentials.password" required placeholder="Enter password123" />
      </div>

      @if (errorMessage) {
        <div class="error-banner">{{ errorMessage }}</div>
      }

      <button type="submit" [disabled]="!loginForm.form.valid" class="btn-login">Unlock System</button>
    </form>
  </div>
</div>
