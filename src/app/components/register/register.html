<div class="register-page-container">
  <div class="register-card">

    <div class="register-header">
      <div class="brand-badge">📚</div>
      <h2>Join the Library</h2>
      <p class="subtitle">Create an account to keep tracking premium publication copies</p>
    </div>

    @if (errorMessage) {
      <div class="error-banner">⚠️ {{ errorMessage }}</div>
    }
    @if (successMessage) {
      <div class="success-banner">✨ {{ successMessage }}</div>
    }

    <form (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="reg-username">Username</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="reg-username" name="username" [(ngModel)]="user.username" required placeholder="Enter username" />
        </div>
      </div>

      <div class="form-group">
        <label for="reg-email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉️</span>
          <input type="email" id="reg-email" name="email" [(ngModel)]="user.email" required placeholder="name@example.com" />
        </div>
      </div>

      <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
<input
      [type]="showPassword ? 'text' : 'password'"
      id="password"
      name="password"
      [(ngModel)]="user.passwordHash"
      required
      placeholder="••••••••" />

    <button type="button" class="password-toggle-eye" (click)="togglePasswordVisibility()">
      {{ showPassword ? '👁️‍🗨️' : '👁️' }}
    </button>
  </div>
      </div>

      <button type="submit" [disabled]="!registerForm.form.valid" class="btn-register">
        Create Account 🚀
      </button>
    </form>

    <p class="auth-switch-text">
      Already have an account? <a routerLink="/login">Sign In here</a>
    </p>
  </div>
</div>
